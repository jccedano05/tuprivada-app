# Configuración de prueba para tests de integración
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configuración de Conekta para pruebas
conekta.api-key=key_test_example
conekta.public-key=key_test_public
conekta.private-key=key_test_private
conekta.webhook-key=test_webhook_key
conekta.environment=sandbox
conekta.skip-webhook-signature-validation=true

# Logging para debug en pruebas
logging.level.com.jccv.tuprivadaapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
