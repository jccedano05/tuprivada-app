# Configuración de Conekta Payment Gateway
# Este archivo debe ser incluido en application.properties o usado como perfil separado

# API Keys de Conekta (obtener del dashboard de Conekta)
conekta.api-key=key_gKuHXU2qvSrqFA2ZY1i4Mzr
conekta.public-key=key_KTxkkpboGuMwGqB02YOJUu6
conekta.private-key=key_gKuHXU2qvSrqFA2ZY1i4Mzr
conekta.webhook-

# Ambiente (sandbox | production)
conekta.environment=sandbox
conekta.locale=es
conekta.api-version=2.2.0

# Timeouts en milisegundos
conekta.connect-timeout=30000
conekta.read-timeout=30000
conekta.debug-mode=false

# Comisiones y tarifas
conekta.platform-fee-percentage=2.9
conekta.platform-fee-fixed=3.00
conekta.tax-percentage=16.0

# URLs de retorno para checkout
conekta.success-url=${CONEKTA_SUCCESS_URL:http://localhost:8080/payment/success}
conekta.failure-url=${CONEKTA_FAILURE_URL:http://localhost:8080/payment/failure}
conekta.webhook-url=${CONEKTA_WEBHOOK_URL:https://tudominio.com/api/v1/webhooks/conekta}

# Notas importantes:
# 1. Reemplazar las keys de prueba con las reales del dashboard de Conekta
# 2. Para producción, cambiar environment a "production" y usar keys de producción
# 3. El webhook-url debe ser una URL pública accesible por Conekta
# 4. Configurar el webhook en el dashboard de Conekta con la URL y eventos deseados

# Logging específico para diagnosticar integración Conekta
logging.level.com.jccv.tuprivadaapp.service.payment.gateway.impl=DEBUG
logging.level.com.jccv.tuprivadaapp.service.payment.gateway.conekta=DEBUG
