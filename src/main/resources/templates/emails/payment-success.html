<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago Exitoso</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; color: #333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; }
        .header { background-color: #076445; color: white; padding: 20px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { padding: 20px; }
        .footer { padding: 15px; text-align: center; color: #888; font-size: 12px; }
        .amount { font-size: 22px; font-weight: bold; color: #2563eb; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>¡Pago Exitoso!</h1>
    </div>
    <div class="content">
        <p>Hola <span th:text="${nombre}">nombre</span>,</p>
        <p>Hemos recibido correctamente tu pago.</p>
        <p class="amount" th:text="'Monto pagado: ' + ${monto}"></p>
        <p>Gracias por tu confianza.</p>
        <p>Si tienes alguna duda, puedes contactarnos a través de la administración de tu condominio.</p>
    </div>
    <div class="footer">
        <p>Ayni Comunidad · 2025</p>
    </div>
</div>
</body>
</html>
